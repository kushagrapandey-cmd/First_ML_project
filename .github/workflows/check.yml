name: Verify YTGuide
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ytguide
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ytguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytguide -d ytguide_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ytguide:test-only@localhost:5432/ytguide_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements.txt
      - run: node scripts/prepare-model.mjs
      - run: python3 scripts/evaluate-ranking.py
      - run: python3 -m unittest discover -s tests -v
      - run: npm run check
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

